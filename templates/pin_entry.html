<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Verification | Government Issuance Collector</title>
  <style>
    :root {
      --brand-navy: #0d233a;
      --brand-navy-light: #16375c;
      --bg-page: #f1f5f9;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --border-default: #cbd5e1;
      --border-focus: #0d233a;
      --status-danger-text: #b91c1c;
      --status-danger-bg: #fef2f2;
      --status-danger-border: #fecaca;
      --radius: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.25rem;
    }

    .pin-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius);
      padding: 2.25rem 2rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    .pin-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .pin-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--brand-navy);
      background-color: #e2e8f0;
      padding: 0.25rem 0.65rem;
      border-radius: 4px;
      margin-bottom: 0.75rem;
    }

    .pin-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--brand-navy);
      margin-bottom: 0.35rem;
      letter-spacing: -0.01em;
    }

    .pin-desc {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .pin-notice {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Alert / Error Banner */
    .pin-alert {
      display: none;
      padding: 0.65rem 0.85rem;
      margin-bottom: 1.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--status-danger-text);
      background-color: var(--status-danger-bg);
      border: 1px solid var(--status-danger-border);
      border-radius: var(--radius);
      text-align: center;
    }

    .pin-alert.visible {
      display: block;
    }

    /* Input Grid */
    .pin-grid {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .pin-digit {
      width: 48px;
      height: 56px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      background-color: #ffffff;
      border: 1.5px solid var(--border-default);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      -moz-appearance: textfield;
    }

    .pin-digit::-webkit-outer-spin-button,
    .pin-digit::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .pin-digit:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(13, 35, 58, 0.15);
    }

    .pin-grid.is-invalid .pin-digit {
      border-color: var(--status-danger-text);
      background-color: var(--status-danger-bg);
    }

    /* Terms Checkbox Group */
    .terms-group {
      margin-bottom: 1.25rem;
      padding: 0.5rem 0.25rem;
      border-radius: var(--radius);
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .terms-group.is-invalid {
      background-color: var(--status-danger-bg);
      border: 1px solid var(--status-danger-border);
      padding: 0.5rem 0.65rem;
    }

    .terms-checkbox-label {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      cursor: pointer;
      font-size: 0.8125rem;
      line-height: 1.45;
      color: var(--text-secondary);
      user-select: none;
    }

    .terms-checkbox {
      width: 18px;
      height: 18px;
      margin-top: 1px;
      flex-shrink: 0;
      accent-color: var(--brand-navy);
      cursor: pointer;
      border-radius: 3px;
    }

    .terms-checkbox:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    .terms-text a {
      color: #1d4ed8;
      text-decoration: underline;
      font-weight: 600;
    }

    .terms-text a:hover {
      color: var(--brand-navy);
    }

    .pin-footer-legal {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .pin-footer-legal a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    .pin-footer-legal a:hover {
      text-decoration: underline;
      color: var(--brand-navy);
    }

    /* Action Button */
    .btn-submit {
      width: 100%;
      height: 44px;
      background-color: var(--brand-navy);
      color: #ffffff;
      border: none;
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: var(--brand-navy-light);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Shake Animation */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .shake {
      animation: shake 0.35s ease-in-out;
    }

    @media (prefers-reduced-motion: reduce) {
      .shake { animation: none; }
    }
  </style>
</head>
<body>

  <main class="pin-card" role="main">
    <div class="pin-header">
      <span class="pin-badge">Temporary Access Gate</span>
      <h1 class="pin-title">Authentication Required</h1>
      <p class="pin-desc">Please enter your 6-digit access PIN to unlock the dashboard.</p>
      <p class="pin-notice">Enforcing single active session. Logging in here will disconnect any other active session.</p>
    </div>

    <div id="errorAlert" class="pin-alert" role="alert" aria-live="polite"></div>

    <form id="pinForm" autocomplete="off">
      <div class="pin-grid" id="pinGrid" data-digits="6">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-digit" aria-label="Digit 1 of 6" required autofocus>
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-digit" aria-label="Digit 2 of 6" required>
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-digit" aria-label="Digit 3 of 6" required>
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-digit" aria-label="Digit 4 of 6" required>
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-digit" aria-label="Digit 5 of 6" required>
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-digit" aria-label="Digit 6 of 6" required>
      </div>

      <div class="terms-group" id="termsGroup">
        <label class="terms-checkbox-label" for="termsAgree">
          <input type="checkbox" id="termsAgree" name="terms_agreed" class="terms-checkbox" required>
          <span class="terms-text">
            I agree to the <a href="/terms" target="_blank" rel="noopener noreferrer">Terms of Service</a> and <a href="/privacy" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
          </span>
        </label>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <span id="btnText">Verify PIN</span>
      </button>
    </form>

    <div class="pin-footer-legal">
      <a href="/terms" target="_blank" rel="noopener noreferrer">Terms of Service</a> &bull;
      <a href="/privacy" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
    </div>
  </main>

  <script>
    (function() {
      const form = document.getElementById("pinForm");
      const grid = document.getElementById("pinGrid");
      const inputs = Array.from(grid.querySelectorAll(".pin-digit"));
      const submitBtn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");
      const errorAlert = document.getElementById("errorAlert");
      const termsCheckbox = document.getElementById("termsAgree");
      const termsGroup = document.getElementById("termsGroup");

      function showError(msg, target = "pin") {
        errorAlert.textContent = msg;
        errorAlert.classList.add("visible");
        if (target === "terms") {
          termsGroup.classList.add("is-invalid", "shake");
          setTimeout(() => termsGroup.classList.remove("shake"), 400);
        } else {
          grid.classList.add("is-invalid", "shake");
          setTimeout(() => grid.classList.remove("shake"), 400);
        }
      }

      function clearError() {
        errorAlert.classList.remove("visible");
        grid.classList.remove("is-invalid");
        termsGroup.classList.remove("is-invalid");
      }

      function getPinValue() {
        return inputs.map(input => input.value).join("");
      }

      function resetInputs() {
        inputs.forEach(input => input.value = "");
        inputs[0].focus();
      }

      termsCheckbox.addEventListener("change", () => {
        clearError();
      });

      // Input Event Handlers
      inputs.forEach((input, index) => {
        // Enforce single digit and advance focus
        input.addEventListener("input", (e) => {
          clearError();
          const val = e.target.value.replace(/\D/g, "");
          input.value = val ? val[0] : "";

          if (input.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }

          // Auto-submit when all boxes are populated
          if (getPinValue().length === inputs.length) {
            if (!termsCheckbox.checked) {
              showError("Please tick the box to agree to the Terms of Service and Privacy Policy.", "terms");
              termsCheckbox.focus();
              return;
            }
            form.requestSubmit();
          }
        });

        // Keydown handling: Backspace & Arrow navigation
        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace") {
            clearError();
            if (!input.value && index > 0) {
              inputs[index - 1].focus();
              inputs[index - 1].value = "";
              e.preventDefault();
            }
          } else if (e.key === "ArrowLeft" && index > 0) {
            inputs[index - 1].focus();
          } else if (e.key === "ArrowRight" && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        });

        // Paste support: strip non-numeric, distribute across fields
        input.addEventListener("paste", (e) => {
          e.preventDefault();
          clearError();
          const pastedData = (e.clipboardData || window.clipboardData).getData("text");
          const digits = pastedData.replace(/\D/g, "").slice(0, inputs.length);

          if (!digits) return;

          digits.split("").forEach((char, idx) => {
            if (inputs[idx]) inputs[idx].value = char;
          });

          const nextIndex = Math.min(digits.length, inputs.length - 1);
          inputs[nextIndex].focus();

          if (digits.length === inputs.length) {
            form.requestSubmit();
          }
        });

        // Auto-select text on focus
        input.addEventListener("focus", () => input.select());
      });

      // Submit Form
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const pin = getPinValue();

        if (pin.length !== inputs.length) {
          showError("Please enter all 6 digits.");
          return;
        }

        if (!termsCheckbox.checked) {
          showError("Please tick the box to agree to the Terms of Service and Privacy Policy.", "terms");
          termsCheckbox.focus();
          return;
        }

        // Disable UI during roundtrip
        inputs.forEach(inp => inp.disabled = true);
        termsCheckbox.disabled = true;
        submitBtn.disabled = true;
        btnText.textContent = "Verifying...";

        try {
          const res = await fetch("/api/auth/pin", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              pin,
              terms_agreed: termsCheckbox.checked
            })
          });

          if (res.ok) {
            window.location.href = "/";
          } else {
            const data = await res.json().catch(() => ({}));
            showError(data.error || "Incorrect PIN");
            resetInputs();
          }
        } catch (err) {
          showError("Network error. Please try again.");
          resetInputs();
        } finally {
          inputs.forEach(inp => inp.disabled = false);
          termsCheckbox.disabled = false;
          submitBtn.disabled = false;
          btnText.textContent = "Verify PIN";
        }
      });
    })();
  </script>
</body>
</html>
